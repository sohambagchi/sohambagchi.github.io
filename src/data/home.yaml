tagline: "PhD student in Computer Science, [Kahlert School of Computing, University of Utah](https://www.cs.utah.edu/)"
description: >-
  I'm a PhD student at the University of Utah, working with
  [Anton Burtsev](https://users.cs.utah.edu/~aburtsev/) on agentic AI that builds isolated,
  fast userspace drivers — and on what Rust's safety actually costs in systems code.
  Before that, with Vijay Nagarajan, I worked on memory consistency models for heterogeneous hardware.
